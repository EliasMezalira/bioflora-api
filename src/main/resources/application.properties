quarkus.rest-client.openai-api.url=https://generativelanguage.googleapis.com/v1beta/openai
quarkus.rest-client.openai-api.logging.scope=request-response
quarkus.rest-client.openai-api.logging.body-limit=4000
quarkus.rest-client.openai-api.logging.masked-headers=Authorization,Cookie
ai.openai.token=${IAToken}
ai.openai.model=${MODEL:gemini-3.6-flash}

quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.origins=*
quarkus.http.cors.exposed-headers=X-Paging-Total-Count,X-Paging-Current-Page

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Bioflora API
mp.openapi.extensions.smallrye.info.version=1.0.0

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${user:bioflora}
quarkus.datasource.password=${pass:xxx}
quarkus.datasource.jdbc.url=${dbUrl:jdbc:postgresql://dpg-d9rlhls9v7es73ciqfp0-a.virginia-postgres.render.com:5432/bioflora}

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/master.xml

# JWT Configuration
mp.jwt.verify.issuer=bioflora-api
mp.jwt.verify.publickey.location=public.pem
smallrye.jwt.sign.key.location=private.pem

# JPA
quarkus.jpa.show_sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
# Ensure byte[] LOBs are sent as bytea (avoid PG OID binding)
hibernate.jdbc.lob.non_contextual_creation=true

# Configuração para o ambiente de Teste do Quarkus
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.liquibase.migrate-at-start=false
