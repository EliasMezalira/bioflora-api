version: '3.8'

services:
  app:
    # Usamos a mesma imagem do Maven para fazer o build
    image: maven:3.9-amazoncorretto-25
    working_dir: /workspace
    volumes:
      - ./:/workspace:cached
      - m2-cache:/root/.m2
      # Mapeamos o socket do Docker para que o Quarkus possa criar o container de build nativo (Mandrel/GraalVM)
      - /var/run/docker.sock:/var/run/docker.sock
    # O comando faz o build nativo via container e depois executa o binário gerado
    command: >
      bash -c "./mvnw package -Pnative -Dquarkus.native.container-build=true -DskipTests 
      && ./target/*-runner -Dquarkus.http.host=0.0.0.0"
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_PROFILE=prod # Mudamos para prod, que é o padrão para builds nativos
    depends_on:
      - db
    env_file: .env

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bioflora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./MIGRATION.sql:/docker-entrypoint-initdb.d/migration.sql:ro

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db-data:
  m2-cache: